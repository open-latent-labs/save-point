version: '3.8'

services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always

    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: qwer1234

    command: server /data --console-address ":9001"

    volumes:
      - minio-data:/data

volumes:
  minio-data:

  # 192.168.0.156