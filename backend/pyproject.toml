[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "ollama>=0.6.2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-pptx>=1.0.2",
    "pillow>=10.0.0",
    "python-jose>=3.5.0",
    "redis==5.0.8",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.50",
    "minio>=7.2.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
    "nvidia-ml-py>=13.610.43",
    "setuptools>=81.0.0",
    "email-validator>=2.3.0",
    "bcrypt==4.0.1",
    "flagembedding>=1.4.0",
    "python-ulid>=3.1.0",
    "sse-starlette>=3.4.4",
    "torch>=2.6",
    "surya-ocr>=0.17.1",
    "paddlepaddle==3.2.2",
    "paddleocr==3.7.0",
    "ragas>=0.4.3",
]

[tool.uv]
torch-backend = "cpu"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
